name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push to the same branch makes the running check obsolete.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The coverage comment is written by this job, not by a third-party action.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # `nx affected` diffs against a base commit, which a shallow clone lacks.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Resolves NX_BASE and NX_HEAD: on a PR the merge base, on main the last
      # commit that ran this workflow to completion.
      - uses: nrwl/nx-set-shas@v4

      # Remote caching, decided on NG-562: GitHub's own cache rather than Nx
      # Cloud, so no third party sits in the loop of the repo that will hold
      # provider and SCM credentials. Runs on `main` seed the entry that PRs
      # restore through the key prefixes below.
      - name: Restore the Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      # Cheap enough repo-wide that narrowing it to affected files would only
      # cost us the guarantee.
      - name: Check formatting
        run: pnpm exec prettier --check .

      # A PR checks only what it touched; main re-checks everything, so a wrong
      # `affected` answer can never leave main unverified.
      - name: Build, type-check and lint
        run: pnpm exec nx ${{ github.event_name == 'pull_request' && 'affected' || 'run-many' }} -t build typecheck lint

      # Separate from the step above because `--coverage` is forwarded to every
      # target in the invocation, and `tsc` and `eslint` do not accept it.
      # A project whose coverage drops below the thresholds pinned in its
      # `vitest.config.mts` fails here.
      - name: Test with coverage
        run: pnpm exec nx ${{ github.event_name == 'pull_request' && 'affected' || 'run-many' }} -t test --coverage

      # `always()`: a coverage drop fails the step above, and that is precisely
      # when the numbers are worth reading. Vitest writes the reports before it
      # checks the thresholds, so they are on disk either way.
      - name: Render the coverage report
        if: always()
        run: node tools/coverage-report.mjs > coverage-report.md

      - name: Publish the coverage report to the run summary
        if: always()
        run: cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      # The thresholds are pinned to what this runner measures, so when a run
      # fails on a drop the per-file numbers are what tell you which line moved
      # — and they are not in the log, only in the report on disk.
      - name: Keep the coverage summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summaries
          path: '*/*/test-output/vitest/coverage/coverage-summary.json'
          if-no-files-found: warn

      # One comment per PR, edited in place on every push rather than stacking.
      - name: Comment the coverage report on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file coverage-report.md \
            --edit-last \
            --create-if-none

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # This service will hold provider and SCM credentials, so a known-exploitable
      # dependency is a merge blocker. An advisory with no fix available is
      # waived one GHSA at a time in `pnpm.auditConfig.ignoreGhsas` (JSON takes
      # no comments, so the README carries the reason) — never by relaxing this
      # level, which would waive the next real one silently too.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  # Flags dependencies a PR *adds*, which `pnpm audit` cannot distinguish from
  # the ones it inherited. Free on a public repo; needs Advanced Security on a
  # private one.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # The single required status check on `main`. A job that is skipped or
  # conditional never reports a result of its own, so branch protection cannot
  # depend on one directly; this job always reports, and refuses anything that
  # is not a pass.
  ci:
    needs: [check, audit, dependency-review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything that did not pass
        env:
          CHECK: ${{ needs.check.result }}
          AUDIT: ${{ needs.audit.result }}
          # `skipped` on a push to main, where there is no PR to diff.
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
        run: |
          echo "check:             $CHECK"
          echo "audit:             $AUDIT"
          echo "dependency-review: $DEPENDENCY_REVIEW"

          failed=0

          # These two are unconditional, so `skipped` is a fault here, not a pass.
          for result in "$CHECK" "$AUDIT"; do
            [ "$result" = success ] || failed=1
          done

          case "$DEPENDENCY_REVIEW" in
            success | skipped) ;;
            *) failed=1 ;;
          esac

          if [ "$failed" -ne 0 ]; then
            echo "::error::At least one check did not pass."
            exit 1
          fi
