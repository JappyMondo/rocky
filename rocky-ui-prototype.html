  return () => removeEventListener("keydown", onKey);

return { css, mount };

const ORB = {
  done: ["#2ea043", "#0d2f1a", "✓"],
  waiting: ["#d29922", "#2b2113", "◔"],

function mount(root) {

  let stage = state.screen === "checkpoint" ? "checkpoint" : (groups[groups.length - 1]?.key ?? "plan");

  let logOpen = false;
  let lightbox = null;

  const wrap = el("div.b-wrap");
  root.append(wrap);

  function draw() {
    wrap.innerHTML = "";
    wrap.append(top(), rail(), body(), drawer());
  }

  function top() {
    return el("div.b-top", {},
      el("h1", {}, `${r.issue.identifier} ${r.issue.title}`),
      el("span.sub", {}, `${r.repo} · ${r.branch} · PR #${r.pr.number}`),
      el("span.b-pill", { style: "border-color:#d29922;color:#d29922" }, "waiting for you · 44m"),
      el("span.sub", {}, `${r.boots} boots`),
      el("div.b-runs", {}, runs.map((x) => el("button", { "data-sel": x.id === state.run || false, onclick: () => go({ run: x.id }) },
        el("b", {}, x.id), " ", x.status === "running" ? "⟳" : x.status === "awaiting-checkpoint" ? "◔" : x.status === "merged" ? "✓" : x.status === "exhausted" ? "!" : "×"))));
  }

  // ── the rail: the whole Run as one fixed row ───────────────────────────
  function rail() {
    const bar = el("div.b-rail");
    for (const s of STAGES) {
      const g = groups.find((x) => x.key === s.key);
      const entries = g?.entries ?? [];
      const last = entries[entries.length - 1];
      const kind = !g ? "todo" : last.status === "waiting" ? "waiting" : "done";
      const [border, bg, glyph] = ORB[kind];
      const its = entries.filter(iteration).map(iteration);
      const cap = its[0]?.cap;
      const passes = its.length ? Math.max(...its.map((i) => i.n)) : 0;
      const clean = entries.some((e) => e.result?.complaints?.length === 0);
      bar.append(el("button.b-stage", { "data-sel": stage === s.key || false, onclick: () => { stage = s.key; draw(); } },
        el("div.b-orb", { style: `border-color:${border};background:${bg};color:${border}` }, glyph),
        el("span.b-name", {}, s.name),
        el("span.b-sub", {}, subtitle(s.key, g, entries)),
        cap ? el("div.b-pips", {}, Array.from({ length: cap }, (_, i) =>
          el("span.b-pip", { "data-on": i < passes && !(clean && i === passes - 1) || false, "data-ok": (clean && i === passes - 1) || false })))
          : el("div.b-pips", {})));
    }
    return bar;
  }

  function subtitle(key, g, entries) {
    if (!g) return key === "merge" ? "blocked" : "";
    if (key === "checkpoint") return "since 10:03";
    const its = entries.filter(iteration).map(iteration);
    if (its.length) return `${Math.max(...its.map((i) => i.n))}/${its[0].cap} passes`;
    const ms = entries.reduce((a, e) => a + (e.ms ?? 0), 0);

  // ── body: stage detail | pinned artifact ───────────────────────────────

  function left() {

    if (!g) { pane.append(el("p", { style: "color:#6e7781" }, "Not reached. The Run is parked at the Checkpoint.")); return pane; }
    for (const e of g.entries) {
      if (isNoise(e)) { pane.append(el("div.b-noise", {}, `#${e.seq} ${e.step}`)); continue; }
      const cs = complaintsOf(e);
      const box = el("div.b-step");

        el("span", { style: `color:${e.status === "waiting" ? "#d29922" : isBad(e) ? "#f85149" : "#3fb950"}` }, e.status === "waiting" ? "◔" : isBad(e) ? "!" : "✓"),
        el("b", {}, e.label ?? (isAgent(e) ? agentName(e) : e.step)),
        el("span.t", {}, `#${e.seq} · boot ${e.boot} · ${fmtMs(e.ms)}`)));

      else if (e.result?.summary) b.append(el("div", {}, e.result.summary));
      else if (e.result?.fixed) b.append(el("div", {}, e.result.fixed.map((f) => el("div", {}, "✓ " + f))));
      else if (e.step === "scm:waitForCi") b.append(el("div", {}, e.result.status === "passed" ? el("span.b-ok", {}, "6/6 green") : `${e.result.failedJobs.length} jobs failed`));

  function right() {
    const pane = el("div.b-right");
    pane.append(el("div.b-tabs", {}, [["diff", `Diff · ${r.diff.files.length} files`], ["shots", "Screenshots · 5"], ["ci", "CI · 6 checks"], ["issue", "Ticket"]]

    if (tab === "ci") art.append(...r.ci.jobs.map((j) => el("div.b-job", {},
      el("span", { style: "color:#3fb950" }, "✓"), j.name, el("span.t", {}, fmtMs(j.ms)))),
      el("div.b-job", { style: "border-color:#3a1418" }, el("span", { style: "color:#f85149" }, "×"),
        `previous attempt ${r.ci.previous.sha} — 2 failures, fixed by ci-fixer 1/3`));
    if (tab === "issue") art.append(el("div", { style: "font-size:13px" }, el("h4", {}, r.issue.title), el("p", {}, r.issue.description),

  function fileBlock(f) {
    const box = el("div.b-file", {}, el("h4", {}, f.path, el("span", {}, `+${f.added} −${f.removed}`)));
    const g = el("div.b-split");

  function drawer() {
    const lines = r.journal.flatMap((e) => (e.chatter ?? []).map((c) => [e, c]));
    const d = el("div.b-drawer", {},
      el("div.b-drawer-h", { onclick: () => { logOpen = !logOpen; draw(); } },
        el("b", {}, logOpen ? "▾" : "▸"), `raw agent stream · ${lines.length} lines · press ~`,
        el("span", { style: "margin-left:auto" }, "hidden by default")));

      el("div", {}, el("span.s", {}, `#${String(e.seq).padStart(2, "0")} ${(e.label ?? e.step).padEnd(24)} `), c))));

  }

  function zoom(s) {

    lightbox = el("div.b-lightbox", { onclick: () => { lightbox.remove(); lightbox = null; } }, el("img", { src: s.src }));
    document.body.append(lightbox);
  }

  function answer(kind, text) {
    alert(`PROTOTYPE — no backend.\n\ndecision: ${kind}${text ? `\nmessage: ${text}` : ""}\n\nJournal #27 flips waiting → done; the Run resumes at #28 (scm:updateBranch).`);

  const onKey = (ev) => {
    if (ev.target.matches?.("input,textarea")) { if (ev.key === "Escape") ev.target.blur(); return; }

    if (ev.key === "d") { tab = "diff"; draw(); }
    if (ev.key === "p") { tab = "shots"; draw(); }
    if (ev.key === "c") { tab = "ci"; draw(); }

    if (ev.key === "Escape") { lightbox?.remove(); lightbox = null; }
  };

  return () => removeEventListener("keydown", onKey);
}

})();

        el("span", { class: cls }, `  ${e.status === "waiting" ? G.waiting : bad ? G.bad : G.done} `),
        `${truncName(e.label ?? (isAgent(e) ? agentName(e) : e.step), 22).padEnd(23)}`,
        el("span.d-dim", {}, fmtMs(e.ms).padStart(7))));
    }
    p.append(el("div.d-hd", {}, `└${"─".repeat(34)}┘`));
    return p;
  }

  function right() {
    const row = rows[cur];
    const p = el("div.d-pane");
    if (!row) return p;

    if (row.kind === "file") {
      p.append(el("div.d-hd", {}, `── ${row.f.path}  +${row.f.added} −${row.f.removed} ${"─".repeat(4)}`));
      for (const h of row.f.hunks) {
        p.append(el("div.d-row.d-hunk", {}, h.header));
        for (const [sign, text] of h.lines)
          p.append(el("div.d-row" + (sign === "+" ? ".d-add" : sign === "-" ? ".d-del" : ""), {}, `${sign} ${text}`));
      }
      p.append(el("div.d-note", {}, "\n※ finding: this is the format diffs were invented in. Nothing about\n  a terminal hurts here — arguably the reverse."));
      return p;
    }

    if (row.kind === "shot") {
      p.append(el("div.d-hd", {}, `── ${row.s.id}.png ${"─".repeat(20)}`));
      p.append(el("div.d-shotwrap", {}, el("img.d-shot", { src: row.s.src })));
      p.append(el("div.d-row.d-dim", {}, row.s.caption));
      p.append(el("div.d-note", {},
        "\n※ finding: this is a 1280×800 screenshot at ~62 columns, which is what\n" +
        "  kitty/iTerm inline images actually give you in a split pane. The\n" +
        "  overlap bug in iter1.png is *just about* visible. Reading a\n" +
        "  validation message, or judging spacing, is not.\n\n" +
        "  Terminals with no image protocol (Terminal.app, most SSH) get\n" +
        "  nothing at all — the fallback is `open` in a browser, which is\n" +
        "  the browser again, one step later."));
      return p;
    }

    if (row.kind === "stage") {
      const g = groups.find((x) => x.key === row.key);
      p.append(el("div.d-hd", {}, `── ${row.label} ${"─".repeat(24)}`));
      p.append(el("div.d-row", {}, `${g.entries.length} steps, ${fmtMs(g.entries.reduce((a, e) => a + (e.ms ?? 0), 0))}, ${g.entries.flatMap(complaintsOf).length} complaints raised`));
      return p;
    }

    const e = row.e;
    p.append(el("div.d-hd", {}, `── #${e.seq} ${e.label ?? e.step}  [boot ${e.boot}] ${"─".repeat(8)}`));
    if (e.step === "scm:waitForCi" && e.result.status === "failed") {
      p.append(el("div.d-row.d-bad", {}, `\n  pipeline red — ${e.result.failedJobs.length} failing jobs\n`));
      for (const j of e.result.failedJobs)
        p.append(el("div.d-row", {}, el("span.d-bad", {}, `  ✗ ${j.name}\n`), el("span.d-dim", {}, j.excerpt.split("\n").map((l) => "      " + l).join("\n") + "\n")));
      p.append(el("div.d-note", {}, "\n※ finding: CI log excerpts are the other thing a terminal is native at."));
      return p;
    }
    if (e.step === "checkpoint") {
      p.append(el("div.d-row.d-wait", {}, `\n  ${e.label}\n`));
      p.append(el("div.d-row", {}, "  compliance ✓   ui ✓   review ✓   ci ✓ 6/6   mergeable: clean\n"));
      p.append(el("div.d-row", {}, `  ${r.pr.url}\n`));
      p.append(el("div.d-row", {}, "  ", el("span.d-key", {}, "a"), " approve   ", el("span.d-key", {}, "x"), " reject   ",
        el("span.d-key", {}, ":steer <text>"), " steer\n"));
      p.append(el("div.d-note", {}, "\n※ finding: the Checkpoint itself is perfectly good in a terminal.\n  It is a question with three answers. It never needed pixels."));
      return p;
    }
    p.append(el("div.d-row", {}, `  status  ${e.status}`));
    for (const c of complaintsOf(e)) p.append(el("div.d-row.d-bad", {}, `  ! ${c.file ? c.file + (c.line ? ":" + c.line : "") + " " : ""}${wrapText(c.text, 74, "    ")}`));
    for (const d of e.result?.disagreed ?? []) p.append(el("div.d-row.d-wait", {}, `  ~ disagreed: ${wrapText(d.why, 70, "    ")}`));
    if (e.result && !e.result.complaints) p.append(el("div.d-row", {}, "\n" + wrapText(JSON.stringify(e.result, null, 1), 78, "  ")));
    if (e.chatter) {
      p.append(el("div.d-hd", {}, `\n── raw stream ${"─".repeat(22)}`));
      p.append(el("div.d-row.d-dim", {}, e.chatter.map((c) => "  " + c).join("\n")));
    }
    return p;
  }

  function status() {
    return el("div.d-status", {},
      el("span.mode", {}, mode),
      msg,
      el("span.right", {}, `${cur + 1}/${rows.length}  ${showNoise ? "all" : "signal"}  boots:${r.boots}`));
  }

  function bindings() {
    return el("div.d-cmd", {}, el("span.d-dim", {},
      "j/k move  gg/G top/bottom  za noise  a approve  x reject  :steer <text>  :runs  :diff  ? help"));
  }

  function cmdline() {
    const inp = el("input", { value: cmd });
    inp.addEventListener("keydown", (e) => {
      e.stopPropagation();
      if (e.key === "Escape") { cmd = null; mode = "NORMAL"; draw(); }
      if (e.key === "Enter") { run(inp.value); cmd = null; mode = "NORMAL"; draw(); }
    });
    queueMicrotask(() => inp.focus());
    return el("div.d-cmd", {}, inp);
  }

  function run(line) {
    const [c, ...rest] = line.replace(/^:/, "").split(" ");
    if (c === "steer") return answer("steer", rest.join(" "));
    if (c === "approve") return answer("approve");
    if (c === "reject") return answer("reject");
    if (c === "diff") { cur = rows.findIndex((x) => x.kind === "file"); msg = "jumped to the diff"; return; }
    if (c === "runs") { msg = runs.map((x) => x.id).join("  "); return; }
    if (c === "q") { msg = "a TUI you quit; a web UI you leave open. that is also a finding."; return; }
    msg = `unknown command: ${c}`;
  }

  function answer(kind, text) {
    alert(`PROTOTYPE — no backend.\n\ndecision: ${kind}${text ? `\nmessage: ${text}` : ""}\n\nJournal #27 flips waiting → done; the Run resumes at #28.`);
  }


  const onKey = (ev) => {
    if (ev.target.matches?.("input,textarea")) return;
    const vis = visible();
    const at = vis.indexOf(rows[cur]);
    const move = (d) => { const t = vis[Math.max(0, Math.min(vis.length - 1, at + d))]; cur = rows.indexOf(t); draw(); };
    if (ev.key === "j" || ev.key === "n") { ev.preventDefault(); move(1); }
    if (ev.key === "k" || ev.key === "p") { ev.preventDefault(); move(-1); }
    if (ev.key === "G") { cur = rows.length - 1; draw(); }
    if (ev.key === "g") { cur = 0; draw(); }
    if (ev.key === ":") { ev.preventDefault(); cmd = ":"; mode = "COMMAND"; draw(); }
    if (ev.key === "z") { showNoise = !showNoise; msg = showNoise ? "showing post/changedFiles bookkeeping" : "hiding bookkeeping steps"; draw(); }
    if (ev.key === "a") answer("approve");
    if (ev.key === "x") answer("reject");
    if (ev.key === "?") msg = "j/k move · z noise · a approve · x reject · : command · `  raw journal";
  };
  addEventListener("keydown", onKey);
  return () => removeEventListener("keydown", onKey);
}

return { css, mount };
})();
/**
 * PROTOTYPE (NG-573) — the floating variant switcher.
 * Deliberately ugly and high-contrast so it reads as scaffolding, not design.
 */
function mountSwitcher() {
  document.querySelector(".proto-bar")?.remove();
  const i = VARIANTS.findIndex((v) => v.key === state.variant);
  const cur = VARIANTS[i] ?? VARIANTS[0];
  const cycle = (d) => go({ variant: VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key });

  const bar = el("div.proto-bar", {},
    el("button.proto-btn", { onclick: () => cycle(-1), title: "← previous variant" }, "‹"),
    el("div.proto-label", {},
      el("b", {}, `${cur.key} · ${cur.name}`),
      el("span.proto-state", {}, ` run ${state.run} · ${state.screen}`)),
    el("button.proto-btn", { onclick: () => cycle(1), title: "next variant →" }, "›"),
    el("span.proto-hint", {}, "PROTOTYPE NG-573 — ←/→ switches variant, ` dumps journal"),
  );
  document.body.append(bar);
}
function installGlobalKeys() {
  addEventListener("keydown", (e) => {
    const t = e.target;
    if (t.matches?.("input,textarea,[contenteditable]")) return;
    const i = VARIANTS.findIndex((v) => v.key === state.variant);
    if (e.key === "ArrowLeft" && !e.metaKey) { e.preventDefault(); go({ variant: VARIANTS[(i - 1 + VARIANTS.length) % VARIANTS.length].key }); }
    if (e.key === "ArrowRight" && !e.metaKey) { e.preventDefault(); go({ variant: VARIANTS[(i + 1) % VARIANTS.length].key }); }
    if (e.key === "`") { e.preventDefault(); toggleJournalDump(); }
  });
}

/** Rule 5: surface the state. ` shows the raw journal behind whatever is drawn. */
function toggleJournalDump() {
  const open = document.querySelector(".proto-dump");
  if (open) return open.remove();
  
  const json = JSON.stringify(
    activeRun.journal.map(({ seq, step, label, status, result }) => ({ seq, step, label, status, result })),
    null, 1);
  document.body.append(el("div.proto-dump", { onclick: (e) => e.target.closest(".proto-dump") === e.target && e.target.remove() },
    el("pre", {}, `// the raw journal — the only thing that actually exists.\n// Everything each variant draws is a reading of this.\n\n${json}`)));
}


const IMPL = { A: VARIANT_A, B: VARIANT_B, C: VARIANT_C, D: VARIANT_D };
const root = document.getElementById("app");
let teardown = null;
function render() {
  teardown?.();
  root.innerHTML = "";
  document.querySelectorAll("style[data-variant]").forEach((s) => s.remove());
  document.body.className = `variant-${state.variant}`;
  const v = VARIANTS.find((x) => x.key === state.variant) ?? VARIANTS[0];
  const mod = IMPL[v.key];
  if (mod.css) {
    const s = document.createElement("style");
    s.dataset.variant = v.key; s.textContent = mod.css; document.head.append(s);
  }
  teardown = mod.mount(root) ?? null;
  mountSwitcher();
}
onChange(render);
installGlobalKeys();
render();

</script>
</body>
